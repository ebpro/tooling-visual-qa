<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>defect: slide-overflow</title>
<!-- Planted defect (overflow.slide-viewport): leaf section content forced to 1200px
     inside a Reveal deck configured 1050x700. Reveal 5 from CDN (jsdelivr); if the CDN
     is unreachable the selftest marks slide fixtures SKIPPED. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5/dist/reveal.css">
<style>.tall{height:1200px;background:#ddf}</style>
</head>
<body>
<div class="reveal"><div class="slides">
  <section><h2>Slide that fits</h2><p>Short content, within the configured viewport.</p></section>
  <section><div class="tall">Forced taller than the 700px configured viewport</div></section>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/reveal.js@5/dist/reveal.js"></script>
<script>Reveal.initialize({ width: 1050, height: 700, transition: "none", hash: false });</script>
</body>
</html>
